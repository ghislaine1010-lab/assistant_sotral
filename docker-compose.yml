services:
  base_de_donnees:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sotral_user
      POSTGRES_PASSWORD: merci_p@p@10
      POSTGRES_DB: sotral_db
    volumes:
      - donnees_postgres:/var/lib/postgresql/data
      - ./bdd_sotral/schema_sotral.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./bdd_sotral/import_donnees.sql:/docker-entrypoint-initdb.d/2_donnees.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sotral_user -d sotral_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  application:
    build: .
    depends_on:
      base_de_donnees:
        condition: service_healthy
    environment:
      DB_HOST: base_de_donnees
    env_file:
      - .env
    ports:
      - "8000:8000"

volumes:
  donnees_postgres:
