services:
  base_de_donnees:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sotral_user
      POSTGRES_PASSWORD: merci_p@p@10
      POSTGRES_DB: sotral_db
    volumes:
      - donnees_postgres:/var/lib/postgresql/data
      - ./bdd_sotral/sauvegarde_complete.sql:/docker-entrypoint-initdb.d/1_sauvegarde.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sotral_user -d sotral_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  application:
    build: .
    depends_on:
      base_de_donnees:
        condition: service_healthy
    environment:
      DB_HOST: base_de_donnees
      OLLAMA_HOST: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    ports:
      - "8000:8000"

volumes:
  donnees_postgres:
