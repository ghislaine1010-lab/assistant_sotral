<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tableau de bord — Assistant SOTRAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root{
    --ink:#12283F; --route:#1F4E79; --transit:#2E74B5; --signal:#ED7D31;
    --ok:#2F7D5E; --paper:#F6F4EF; --surface:#FFFFFF; --line:#E3DFD6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; color:var(--ink); font-family:'Inter',sans-serif;
    background:
      radial-gradient(circle at 8% 12%, rgba(46,116,181,.10), transparent 40%),
      radial-gradient(circle at 92% 85%, rgba(237,125,49,.10), transparent 42%),
      repeating-linear-gradient(115deg, rgba(31,78,121,.05) 0 2px, transparent 2px 46px),
      var(--paper);
  }
  .entete{
    background:linear-gradient(120deg, var(--route), var(--transit));
    color:#fff; padding:22px 32px; display:flex; align-items:center;
    justify-content:space-between; flex-wrap:wrap; gap:10px;
  }
  .entete h1{ font-family:'Space Grotesk',sans-serif; font-size:24px; margin:0; }
  .entete p{ margin:2px 0 0; font-size:13px; color:#D7E6F2; }
  .entete a{ color:#fff; background:rgba(255,255,255,.16); padding:8px 16px;
             border-radius:20px; text-decoration:none; font-size:13px; transition:background .15s; }
  .entete a:hover{ background:rgba(255,255,255,.28); }
  .perforation{
    height:14px; background:var(--route);
    -webkit-mask: radial-gradient(circle 4.5px at 18px 0, transparent 98%, black 100%) repeat-x;
    mask: radial-gradient(circle 4.5px at 18px 0, transparent 98%, black 100%) repeat-x;
    -webkit-mask-size:34px 14px; mask-size:34px 14px;
  }

  .corps{ max-width:1120px; margin:0 auto; padding:26px 20px 50px; }

  .banniere{
    background:linear-gradient(120deg, var(--ink), var(--route));
    color:#fff; border-radius:16px; padding:20px 26px; margin-bottom:24px;
    font-family:'Space Grotesk',sans-serif; font-size:15.5px; line-height:1.6;
    box-shadow:0 16px 34px -20px rgba(18,40,63,.5);
  }
  .banniere b{ color:#FFD9B3; }

  .cartes{ display:grid; grid-template-columns:repeat(auto-fit, minmax(160px,1fr)); gap:14px; margin-bottom:26px; }
  .carte{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:16px; text-align:center; position:relative; overflow:hidden;
    transition:transform .18s, box-shadow .18s; animation:apparait .4s ease-out;
  }
  .carte:hover{ transform:translateY(-4px); box-shadow:0 14px 28px -16px rgba(18,40,63,.35); }
  @keyframes apparait{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  .carte .icone{
    width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    margin:0 auto 8px; font-size:16px; background:#EFF3F7;
  }
  .carte .valeur{ font-family:'IBM Plex Mono',monospace; font-size:27px; font-weight:600; color:var(--route); }
  .carte .label{ font-size:12px; color:#5B6672; margin-top:3px; }

  h2{ font-family:'Space Grotesk',sans-serif; font-size:17px; color:var(--route); margin:32px 0 12px;
      display:flex; align-items:center; gap:8px; }
  h2::before{ content:"◈"; color:var(--signal); }

  .grille-graphiques{ display:grid; grid-template-columns:1fr 1.3fr; gap:18px; margin-bottom:18px; }
  @media (max-width:820px){ .grille-graphiques{ grid-template-columns:1fr; } }
  .panneau{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:18px; animation:apparait .5s ease-out;
  }
  .panneau canvas{ max-height:280px; }
  .panneau-large{ grid-column:1 / -1; }

  table{ width:100%; border-collapse:collapse; background:var(--surface); border-radius:12px; overflow:hidden; }
  th, td{ padding:11px 14px; text-align:left; font-size:13.5px; border-bottom:1px solid var(--line); }
  th{ background:#EFF3F7; color:var(--route); font-weight:600; }
  tr:hover td{ background:#FAFBFC; }
  .badge{ display:inline-block; padding:3px 10px; border-radius:12px; font-size:11.5px; font-weight:600; color:#fff; }
  .badge-corrige{ background:var(--ok); }
  .badge-documente{ background:var(--signal); }
  .badge-sain{ background:var(--transit); }

  #chargement{ text-align:center; padding:40px; color:#888; }
</style>
</head>
<body>
  <div class="entete">
    <div>
      <h1>📊 Tableau de bord — Assistant SOTRAL</h1>
      <p>Statistiques du réseau et bilan de l'audit de qualité des données</p>
    </div>
    <a href="/app">← Retour au chat</a>
  </div>
  <div class="perforation"></div>

  <div class="corps">
    <div id="chargement">Chargement des statistiques...</div>
    <div id="contenu" style="display:none;">
      <div class="banniere" id="banniere-resume"></div>

      <div class="cartes" id="cartes-reseau"></div>

      <h2>Visualisations</h2>
      <div class="grille-graphiques">
        <div class="panneau"><canvas id="graphique-statuts"></canvas></div>
        <div class="panneau"><canvas id="graphique-ampleur"></canvas></div>
        <div class="panneau panneau-large"><canvas id="graphique-avant-apres"></canvas></div>
      </div>

      <h2>Détail de l'audit de qualité des données</h2>
      <table>
        <thead><tr><th>Dimension vérifiée</th><th>Ampleur constatée</th><th>Statut</th></tr></thead>
        <tbody id="lignes-audit"></tbody>
      </table>
    </div>
  </div>

<script>
const COULEURS = { corrige: "#2F7D5E", documente: "#ED7D31", sain: "#2E74B5" };
const LABELS_STATUT = { corrige: "Corrigé", documente: "Documenté", sain: "Sain" };
const ICONES = ["🚌", "🔢", "📍", "🕐", "🔀", "✅"];

async function charger() {
  try {
    const reponse = await fetch("http://127.0.0.1:8000/dashboard");
    const data = await reponse.json();
    const dims = data.audit_qualite.dimensions;

    const compte = { corrige: 0, documente: 0, sain: 0 };
    dims.forEach(d => compte[d.statut]++);

    document.getElementById("banniere-resume").innerHTML =
      `🔎 <b>${dims.length} dimensions</b> de qualité des données auditées systématiquement — ` +
      `<b>${compte.corrige} anomalies corrigées</b>, <b>${compte.documente} documentées</b> comme limites assumées, ` +
      `<b>${compte.sain} confirmées saines</b>. Réseau reconstruit à <b>100 % de connectivité</b> après correction.`;

    const cartes = [
      { valeur: data.reseau.lignes, label: "Tracés de lignes" },
      { valeur: data.reseau.references_lignes, label: "Lignes (références)" },
      { valeur: data.reseau.arrets, label: "Arrêts géolocalisés" },
      { valeur: data.reseau.horaires, label: "Horaires enregistrés" },
      { valeur: data.reseau.correspondances, label: "Correspondances" },
      { valeur: `${data.tests.reussis}/${data.tests.total}`, label: "Tests de non-régression" },
    ];
    document.getElementById("cartes-reseau").innerHTML = cartes.map((c, i) =>
      `<div class="carte"><div class="icone">${ICONES[i]}</div>
       <div class="valeur">${c.valeur}</div><div class="label">${c.label}</div></div>`
    ).join("");

    new Chart(document.getElementById("graphique-statuts"), {
      type: "doughnut",
      data: {
        labels: Object.keys(compte).map(k => LABELS_STATUT[k]),
        datasets: [{ data: Object.values(compte), backgroundColor: Object.keys(compte).map(k => COULEURS[k]),
          borderColor: "#fff", borderWidth: 2 }],
      },
      options: {
        plugins: {
          title: { display: true, text: `Répartition des ${dims.length} constats d'audit`, font: { size: 13 } },
          legend: { position: "bottom", labels: { font: { size: 11.5 } } },
        },
      },
    });

    new Chart(document.getElementById("graphique-ampleur"), {
      type: "bar",
      data: {
        labels: dims.map(d => d.nom),
        datasets: [{ label: "Ampleur détectée (%)", data: dims.map(d => d.valeur),
          backgroundColor: dims.map(d => COULEURS[d.statut]), borderRadius: 4 }],
      },
      options: {
        indexAxis: "y",
        plugins: { title: { display: true, text: "Ampleur détectée par dimension", font: { size: 13 } }, legend: { display: false } },
        scales: { x: { title: { display: true, text: "%" } } },
      },
    });

    const corriges = dims.filter(d => d.statut === "corrige");
    new Chart(document.getElementById("graphique-avant-apres"), {
      type: "bar",
      data: {
        labels: corriges.map(d => d.nom),
        datasets: [
          { label: "Avant correction", data: corriges.map(d => d.valeur), backgroundColor: "#ED7D31", borderRadius: 4 },
          { label: "Après correction", data: corriges.map(() => 0), backgroundColor: "#2F7D5E", borderRadius: 4 },
        ],
      },
      options: {
        plugins: { title: { display: true, text: "Impact des corrections appliquées : avant / après", font: { size: 14 } },
          legend: { position: "bottom" } },
        scales: { y: { title: { display: true, text: "% du réseau concerné" } } },
      },
    });

    document.getElementById("lignes-audit").innerHTML = dims.map(d =>
      `<tr><td>${d.nom}</td><td>${d.ampleur}</td>
       <td><span class="badge badge-${d.statut}">${LABELS_STATUT[d.statut]}</span></td></tr>`
    ).join("");

    document.getElementById("chargement").style.display = "none";
    document.getElementById("contenu").style.display = "block";
  } catch (e) {
    document.getElementById("chargement").textContent = "Impossible de charger les statistiques (le serveur est-il lancé ?).";
  }
}
charger();
</script>
</body>
</html>
